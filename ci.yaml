name: CI Pipeline

# 1. Define when this workflow will run
on:
  push:
    branches: [ "feturedev"]
  pull_request:
    branches: [ "main",  ]

# 2. Define the jobs that will run
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out your repository code onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up a programming environment (Node.js in this example)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Install project dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run your tests or build scripts
      - name: Run tests
        run: npm test
